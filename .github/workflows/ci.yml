name: ci

on:
  # 作業ブランチは pull_request で検証し、同じコミットの重複実行を避ける。
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch name
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          case "$branch" in
            main|develop|feature/*|fix/*|hotfix/*|docs/*|chore/*|refactor/*|test/*|codex/*|claude/*) echo "Allowed: $branch" ;;
            *) echo "Disallowed branch: $branch" >&2; exit 1 ;;
          esac

  api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        id: dotnet
        with:
          dotnet-version: 8.0.x
      # ランナーの既定の SDK（ubuntu-26.04 では .NET 11）ではなく、入れた SDK 8 で build する。
      # global.json はチェックアウトの外（runner.workspace）に置き、リポジトリには持たない
      # （手元の開発環境の SDK を縛らないため）。
      - name: Pin .NET SDK 8 outside the checkout
        run: dotnet new globaljson --sdk-version "${{ steps.dotnet.outputs.dotnet-version }}" --roll-forward latestPatch --output "${{ runner.workspace }}" --force && dotnet --version
      - run: dotnet restore Nexus.sln
      - run: dotnet build Nexus.sln --no-restore
      - run: dotnet test apps/public-api.Tests/PublicApi.Tests.csproj --no-build
      # NexusStudio のテストとの突合が済むまでの一時的な退避先（E8-7 r1 D-6）
      - run: dotnet test tools/map-validation-legacy/MapValidationLegacy.Tests.csproj --no-build
      - run: dotnet publish apps/public-api/PublicApi.csproj --no-restore -c Release -o /tmp/nexus-public-publish
      - name: public-api の publish に admin-api と JWT・QR の依存が入っていないこと（E8-7 r1）
        run: "! ls /tmp/nexus-public-publish | grep -E '^(AdminApi|QRCoder|JsonSchema|Json\\.More|JetBrains|NetTopologySuite|Microsoft\\.AspNetCore\\.Authentication\\.JwtBearer|Microsoft\\.IdentityModel|System\\.IdentityModel)'"
      - run: mkdir -p artifacts/database && dotnet run --project tools/database/Nexus.Database.csproj --no-build -- script artifacts/database/migrate.sql
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-migration-sql
          path: artifacts/database/migrate.sql
          retention-days: 7

  database-backup-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/database/test_backup_transfer.py
      - run: python deploy/test_public_api_image.py
      - run: bash -n deploy/database/entrypoint.sh deploy/database/backup.sh deploy/database/backup-host.sh deploy/database/compose-production.sh
      - run: bash -n tools/dev-secrets.sh
      - run: "! grep -nE 'CHANGE_ME|nexus_password' docker-compose.yml"
      - name: Compose requires generated secrets
        run: |
          ! docker compose -f docker-compose.yml config -q 2>/dev/null
          bash tools/dev-secrets.sh
          docker compose -f docker-compose.yml config -q

  public-api-readonly-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify public API write boundary
        shell: bash
        run: |
          matches=$(grep -rn --include='*.cs' --exclude-dir=bin --exclude-dir=obj \
            'SaveChangesAsync\|SaveChanges()' apps/public-api \
            | grep -v 'apps/public-api/Services/LogPersistenceService.cs:' || true)
          if [ -n "$matches" ]; then echo "$matches"; exit 1; fi

  map-dataset-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/map-dataset
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web-check:
    # 公開サイト web/（#131）の型検査とビルド。リポジトリは npm workspaces（ルート package.json の
    # "workspaces": ["web"]）で、ロックファイルはルートの package-lock.json だけ。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck --workspace web
      - run: npm run build --workspace web

  image-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f apps/public-api/Dockerfile .
      - run: docker build -f deploy/database/Dockerfile deploy/database

  ios-changes:
    # iOS のジョブを走らせるかを決める。ios-xcode-test は develop の必須チェックで、workflow の paths で
    # 飛ばすと「保留」のまま残るため、ジョブの if で飛ばす（飛ばしたジョブは成功として数えられる）。
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # pull_request ではマージコミットを取り出す。1つ目の親が base の先端なので、深さ 2 で差分が取れる。
          fetch-depth: 2
      - id: diff
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "Event $GITHUB_EVENT_NAME: always run iOS jobs"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          # iOS の試験が読むもの: アプリと試験の本体、ワークフロー、docs/schemas
          # （CampusMapContentBundleTests と ParticipantBundleSchemaExampleTests が
          # docs/schemas/examples/participant-bundle-v2.example.json を読む）。
          if grep -qE '^(apps/nexus-ios/|\.github/workflows/|docs/schemas/)' "$RUNNER_TEMP/changed.txt"; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "No iOS-relevant changes: iOS jobs will be skipped"
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  ios-xcode-test:
    # test アクションがアプリ本体もビルドするため、build だけの別ジョブは置かない。
    # ios-changes が失敗したときも走らせる（判定の失敗で必須チェックを素通りさせない）。
    needs: ios-changes
    if: ${{ !cancelled() && (needs.ios-changes.result != 'success' || needs.ios-changes.outputs.ios == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sw_vers && xcodebuild -version
      - run: xcrun simctl list devices
      - name: Select an available iPhone simulator
        shell: bash
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/ios-devices.json"
          python3 - <<'PY'
          import json, os
          data = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'ios-devices.json')))
          phones = [item for group in data['devices'].values() for item in group
                    if item.get('isAvailable') and item['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator')
          device = next((item for item in phones if item['name'].startswith('iPhone 17')), phones[0])
          print(f"Selected {device['name']} ({device['udid']}) state={device.get('state')}")
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f"IOS_SIMULATOR_ID={device['udid']}\n")
          PY
      # ビルドの間にシミュレーターを起動しておく。
      - name: Boot the simulator in the background
        shell: bash
        run: |
          date -u +%s > "$RUNNER_TEMP/sim-boot-start"
          echo "simctl boot started at $(date -u +%H:%M:%S)"
          nohup bash -c 'xcrun simctl boot "$IOS_SIMULATOR_ID"; echo "simctl boot exited $? at $(date -u +%H:%M:%S)"' > "$RUNNER_TEMP/sim-boot.log" 2>&1 &
      - run: mkdir -p artifacts/ios
      # build と test を分け、どの段階に時間がかかるかをログに残す。試験の対象と内容は以前と同じ。
      - name: Build for testing
        run: xcodebuild -project apps/nexus-ios/Nexus.xcodeproj -scheme Nexus -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" -derivedDataPath "$RUNNER_TEMP/DerivedData" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build-for-testing
      - name: Wait for the simulator to finish booting
        shell: bash
        run: |
          cat "$RUNNER_TEMP/sim-boot.log" || true
          echo "bootstatus started at $(date -u +%H:%M:%S)"
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
          now=$(date -u +%s)
          echo "Simulator booted at $(date -u +%H:%M:%S), $((now - $(cat "$RUNNER_TEMP/sim-boot-start"))) s after boot started"
          cat "$RUNNER_TEMP/sim-boot.log" || true
          xcrun simctl list devices booted
      - name: Test without building
        run: xcodebuild -project apps/nexus-ios/Nexus.xcodeproj -scheme Nexus -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" -derivedDataPath "$RUNNER_TEMP/DerivedData" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -parallel-testing-enabled NO -resultBundlePath artifacts/ios/NexusTests.xcresult test-without-building
      # 失敗時の調査用に xcresult を保存する。
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: nexus-ios-tests
          path: artifacts/ios/NexusTests.xcresult
          retention-days: 7

  ios-release-config:
    # Release（Archive・TestFlight と同じ構成）の生成された Info.plist に、本番の接続先と Bundle ID が完全な形で入ることを確かめる（M1-3）。
    # ios-xcode-test と並べて走らせる。
    needs: ios-changes
    if: ${{ !cancelled() && (needs.ios-changes.result != 'success' || needs.ios-changes.outputs.ios == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Release Info.plist
        shell: bash
        run: |
          xcodebuild -project apps/nexus-ios/Nexus.xcodeproj -scheme Nexus -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet build
          plist="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/Nexus.app/Info.plist"
          privacy_manifest="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/Nexus.app/PrivacyInfo.xcprivacy"
          api_url="$(plutil -extract NexusAPIBaseURL raw "$plist")"
          bundle_id="$(plutil -extract CFBundleIdentifier raw "$plist")"
          non_exempt="$(plutil -extract ITSAppUsesNonExemptEncryption raw "$plist")"
          orientations="$(plutil -extract UISupportedInterfaceOrientations.0 raw "$plist" 2>/dev/null || plutil -extract UISupportedInterfaceOrientations raw "$plist")"
          echo "NexusAPIBaseURL=$api_url CFBundleIdentifier=$bundle_id ITSAppUsesNonExemptEncryption=$non_exempt UISupportedInterfaceOrientations=$orientations"
          test "$api_url" = "https://api.nexus-app.jp"
          test "$bundle_id" = "jp.nexus-app.mobile"
          test "$non_exempt" = "false"
          test "$orientations" = "UIInterfaceOrientationPortrait"
          test -f "$privacy_manifest"
          plutil -lint "$privacy_manifest"
