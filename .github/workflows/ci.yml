name: ci

on:
  # 作業ブランチは pull_request 側で検証する。push も拾うと同じコミットで 2 回走り、
  # 1 台しかない self-hosted iOS ランナーの待ち行列が倍になる。
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch name
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          case "$branch" in
            main|develop|feature/*|fix/*|hotfix/*|docs/*|chore/*|refactor/*|test/*|codex/*|claude/*) echo "Allowed: $branch" ;;
            *) echo "Disallowed branch: $branch" >&2; exit 1 ;;
          esac

  api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Nexus.sln
      - run: dotnet build Nexus.sln --no-restore
      - run: dotnet test apps/admin-api-tests/AdminApi.Tests.csproj --no-build
      - run: dotnet test apps/public-api.Tests/PublicApi.Tests.csproj --no-build
      - run: dotnet publish apps/admin-api/AdminApi.csproj --no-restore -c Release -o /tmp/nexus-admin-publish
      - run: dotnet publish apps/public-api/PublicApi.csproj --no-restore -c Release -o /tmp/nexus-public-publish
      - run: mkdir -p artifacts/database && dotnet run --project tools/database/Nexus.Database.csproj --no-build -- script artifacts/database/migrate.sql
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-migration-sql
          path: artifacts/database/migrate.sql
          retention-days: 7

  database-backup-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/database/test_backup_transfer.py
      - run: python deploy/test_public_api_image.py
      - run: bash -n deploy/database/entrypoint.sh deploy/database/backup.sh deploy/database/backup-host.sh deploy/database/compose-production.sh
      - run: bash -n tools/dev-secrets.sh
      - run: "! grep -nE 'CHANGE_ME|nexus_password' docker-compose.yml"
      - name: Compose requires generated secrets
        run: |
          ! docker compose -f docker-compose.yml config -q 2>/dev/null
          bash tools/dev-secrets.sh
          docker compose -f docker-compose.yml config -q

  public-api-readonly-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify public API write boundary
        shell: bash
        run: |
          matches=$(grep -rn --include='*.cs' --exclude-dir=bin --exclude-dir=obj \
            'SaveChangesAsync\|SaveChanges()' apps/public-api \
            | grep -v 'apps/public-api/Services/LogPersistenceService.cs:' || true)
          if [ -n "$matches" ]; then echo "$matches"; exit 1; fi

  map-dataset-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/map-dataset
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f apps/public-api/Dockerfile .
      - run: docker build -f apps/admin-api/Dockerfile .
      - run: docker build -f deploy/database/Dockerfile deploy/database

  ios-xcode-test:
    # test アクションがアプリ本体もビルドするため、build だけの別ジョブは置かない。
    # vars.IOS_RUNNER == 'self-hosted' で開発者の Mac（docs/self-hosted-ios-runner.md）を使う。
    # 公開リポジトリのため fork からの PR は常に GitHub-hosted で実行する。
    runs-on: ${{ fromJSON(vars.IOS_RUNNER == 'self-hosted' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && '["self-hosted","macOS","ARM64","nexus-ios"]' || '"macos-latest"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sw_vers && xcodebuild -version
      - run: xcodebuild -list -project apps/nexus-ios/Nexus.xcodeproj
      - name: Select an available iPhone simulator
        shell: bash
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/ios-devices.json"
          python3 - <<'PY'
          import json, os
          data = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'ios-devices.json')))
          phones = [item for group in data['devices'].values() for item in group
                    if item.get('isAvailable') and item['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator')
          device = next((item for item in phones if item['name'].startswith('iPhone 17')), phones[0])
          print(f"Selected {device['name']} ({device['udid']})")
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f"IOS_SIMULATOR_ID={device['udid']}\n")
          PY
      - run: mkdir -p artifacts/ios
      - run: xcodebuild -project apps/nexus-ios/Nexus.xcodeproj -scheme Nexus -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -resultBundlePath artifacts/ios/NexusTests.xcresult test
      # 成功時は xcresult を残さない（self-hosted ランナーからの大量アップロードで固まった実績がある）。
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: nexus-ios-tests
          path: artifacts/ios/NexusTests.xcresult
          retention-days: 7
