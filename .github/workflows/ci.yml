permissions:
  contents: read

name: ci

on:
  push:
  pull_request:

jobs:

  api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Nexus.sln
      - run: dotnet build Nexus.sln --no-restore
      - run: dotnet test apps/admin-api-tests/AdminApi.Tests.csproj --no-build

  public-api-readonly-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify public-api has no unsanctioned writes
        run: |
          MATCHES=$(grep -rn --include="*.cs" --exclude-dir=bin --exclude-dir=obj \
            "SaveChangesAsync\|SaveChanges()" \
            apps/public-api \
            | grep -v "apps/public-api/Services/LogPersistenceService.cs:" || true)
          if [ -n "$MATCHES" ]; then
            echo "ERROR: public-api内で許可されていないSaveChangesが呼ばれています。書き込みはadmin-apiの責務です（例外: visit_logs監査ログ書き込みを担うLogPersistenceServiceのみ許可）。"
            echo "$MATCHES"
            exit 1
          fi

  mobile-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          check-latest: true
      - name: Verify npm availability
        run: |
          node --version
          which npm || true
          npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm run test:ci
