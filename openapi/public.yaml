openapi: 3.0.1
info:
  title: Nexus Public API
  version: v1
paths:
  /api/events/today:
    get:
      tags:
        - Events
      summary: 当日 (JST) の公開イベントを取得します。
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TodayEventResponse"
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TodayEventResponse"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TodayEventResponse"
  /api/logs:
    post:
      tags:
        - Logs
      summary: 匿名参加者ログを1件受け付けます。
      requestBody:
        description: ログ情報。
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLogRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateLogRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateLogRequest"
      responses:
        "202":
          description: Accepted
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            text/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/logs/batch:
    post:
      tags:
        - Logs
      summary: 匿名参加者ログを最大50件まとめて受け付けます。
      requestBody:
        description: ログ配列。
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLogBatchRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateLogBatchRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateLogBatchRequest"
      responses:
        "202":
          description: Accepted
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            text/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/nearby:
    get:
      tags:
        - Nearby
      summary: 指定座標の近傍にある公開スポットを距離順で返します。
      parameters:
        - name: lat
          in: query
          description: 緯度。
          schema:
            type: number
            format: double
        - name: lng
          in: query
          description: 経度。
          schema:
            type: number
            format: double
        - name: radius
          in: query
          description: 検索半径 (メートル)。
          schema:
            type: number
            format: double
            default: 500
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NearbySpotResponse"
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NearbySpotResponse"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NearbySpotResponse"
        "400":
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            text/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /health:
    get:
      tags:
        - "PublicApi, Version=1.0.0.0, Culture=neutral, PublicKeyToken=null"
      responses:
        "200":
          description: OK
  "/api/spots/by-code/{code}":
    get:
      tags:
        - Spots
      summary: 公開済みスポットをコードで1件取得します。
      parameters:
        - name: code
          in: path
          description: スポット短縮コード。
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/SpotByCodeResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/SpotByCodeResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/SpotByCodeResponse"
        "404":
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            text/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "400":
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            text/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  schemas:
    AcceptedResponse:
      type: object
      properties:
        accepted:
          type: boolean
      additionalProperties: false
    CreateLogBatchRequest:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/CreateLogRequest"
      additionalProperties: false
    CreateLogRequest:
      required:
        - eventType
        - sessionId
      type: object
      properties:
        sessionId:
          minLength: 1
          type: string
        eventType:
          minLength: 1
          type: string
        spotCode:
          type: string
          nullable: true
        payload:
          nullable: true
        occurredAt:
          type: string
          format: date-time
          nullable: true
        locationLat:
          type: number
          format: double
          nullable: true
        locationLng:
          type: number
          format: double
          nullable: true
        locationAccuracy:
          type: number
          format: double
          nullable: true
      additionalProperties: false
    NearbySpotResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        distanceMeters:
          type: number
          format: double
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        tags:
          type: array
          items:
            type: string
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: {}
    SpotByCodeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        isPublished:
          type: boolean
        tags:
          type: array
          items:
            type: string
        arModelUrl:
          type: string
          nullable: true
      additionalProperties: false
    TodayEventResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        startTime:
          type: string
        endTime:
          type: string
        location:
          type: string
          nullable: true
        spotCode:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
      additionalProperties: false
