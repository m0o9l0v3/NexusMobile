default:
  tags:
    - self-hosted
    - linux
    - docker

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify
  - package
  - ai-review

branch-policy-check:
  stage: verify
  image: alpine:3.20
  script:
    - |
      BRANCH_NAME="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_BRANCH}"
      case "$BRANCH_NAME" in
        main|develop|feature/*|fix/*|hotfix/*|docs/*|chore/*|refactor/*|test/*|codex/*|claude/*)
          echo "Branch name is allowed: $BRANCH_NAME"
          ;;
        recovery/*)
          echo "ERROR: recovery/* ブランチは禁止です。復元元は archive/YYYY-MM-DD/* タグで保全し、必要なコミットだけを作業ブランチへ取り込んでください。"
          exit 1
          ;;
        *)
          echo "ERROR: 許可されていないブランチ名です: $BRANCH_NAME"
          echo "docs/branch-policy.md の命名規則を確認してください。"
          exit 1
          ;;
      esac

api-check:
  stage: verify
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet restore Nexus.sln
    - dotnet build Nexus.sln --no-restore
    - dotnet test apps/admin-api-tests/AdminApi.Tests.csproj --no-build
    - dotnet test apps/public-api.Tests/PublicApi.Tests.csproj --no-build
    - dotnet publish apps/admin-api/AdminApi.csproj --no-restore -c Release -o /tmp/nexus-admin-publish
    - dotnet publish apps/public-api/PublicApi.csproj --no-restore -c Release -o /tmp/nexus-public-publish
    - mkdir -p artifacts/database
    - dotnet run --project tools/database/Nexus.Database.csproj --no-build -- script artifacts/database/migrate.sql
  artifacts:
    paths:
      - artifacts/database/migrate.sql
    expire_in: 7 days

database-backup-check:
  stage: verify
  image: python:3.12-slim
  script:
    - python tools/database/test_backup_transfer.py
    - bash -n deploy/database/entrypoint.sh deploy/database/backup.sh deploy/database/backup-host.sh deploy/database/compose-production.sh

public-api-readonly-check:
  stage: verify
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash grep
  script:
    - |
      bash -c '
      MATCHES=$(grep -rn --include="*.cs" --exclude-dir=bin --exclude-dir=obj \
        "SaveChangesAsync\|SaveChanges()" \
        apps/public-api \
        | grep -v "apps/public-api/Services/LogPersistenceService.cs:" || true)
      if [ -n "$MATCHES" ]; then
        echo "ERROR: public-api内で許可されていないSaveChangesが呼ばれています。書き込みはadmin-apiの責務です（例外: visit_logs監査ログ書き込みを担うLogPersistenceServiceのみ許可）。"
        echo "$MATCHES"
        exit 1
      fi
      '

ios-xcode-build:
  stage: verify
  tags:
    - macos
  needs:
    - ios-xcode-smoke
  script:
    - |
      xcodebuild \
        -project apps/nexus-ios/Nexus.xcodeproj \
        -scheme Nexus \
        -configuration Debug \
        -sdk iphonesimulator \
        -destination 'generic/platform=iOS Simulator' \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        build
  rules:
    - changes:
        - apps/nexus-ios/**/*
        - .gitlab-ci.yml

ios-xcode-smoke:
  stage: verify
  tags:
    - macos
  script:
    - sw_vers
    - xcodebuild -version
    - xcodebuild -list -project apps/nexus-ios/Nexus.xcodeproj
  rules:
    - changes:
        - apps/nexus-ios/**/*
        - .gitlab-ci.yml

mobile-check:
  stage: verify
  image: node:20
  script:
    - cd apps/mobile-ios
    - node --version
    - npm --version
    - npm ci
    - npm run typecheck
    - npm run lint --if-present
    - npm run test:ci

map-dataset-check:
  stage: verify
  image: node:20
  script:
    - cd tools/map-dataset
    - node --version
    - npm ci
    - npm run typecheck
    - npm test

.image-build:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  artifacts:
    paths: [image-digests/]
    expire_in: 30 days

public-api-image:
  extends: .image-build
  script:
    - sh deploy/build-image.sh public-api apps/public-api/Dockerfile

admin-api-image:
  extends: .image-build
  script:
    - sh deploy/build-image.sh admin-api apps/admin-api/Dockerfile

postgres-image:
  extends: .image-build
  script:
    - sh deploy/build-image.sh postgres deploy/database/Dockerfile

ai-review:
  stage: ai-review
  image: node:20
  interruptible: true
  resource_group: "ai-review-global"
  allow_failure: true
  timeout: 10 minutes
  rules:
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      when: never
    - if: '$CI_MERGE_REQUEST_DRAFT == "true"'
      when: never
    - if: '$CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID'
      when: never
    - changes:
        - .gitlab-ci.yml
        - tools/ai-review.mjs
      when: never
    - when: on_success
  script:
    - node tools/ai-review.mjs
