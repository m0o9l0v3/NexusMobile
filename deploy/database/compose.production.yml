# Deployment template. All image references must be validated registry digests.
# admin-api is not part of v1.0 (E8-7 r1). nexus_admin_app stays as a NOLOGIN role that owns no login secret.
services:
  postgres:
    image: ${NEXUS_POSTGRES_IMAGE:?Set a validated image with @sha256 digest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nexus_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, public_password, migrator_password, backup_cipher]
    volumes: [database:/var/lib/postgresql, backup:/backup]
    networks: [database]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nexus_admin']
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  public-api:
    image: ${NEXUS_PUBLIC_IMAGE:?Set a validated public API image digest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabaseProvider: postgresql
      ConnectionStrings__PublicApiReadOnlyFile: /run/secrets/public_connection
      AuditLog__HashKeyFile: /run/secrets/audit_key
      # 公開サイト（web/）の HTTPS オリジン。public-api は GET /health にだけ CORS を許可する（E8-7 C-1、#72）。
      Cors__AllowedOrigins__0: ${NEXUS_PUBLIC_ORIGIN:?Set the HTTPS origin of the public site}
      RateLimiting__KnownNetworks__0: ${NEXUS_TRUSTED_PROXY_NETWORK:?Set the CIDR of the network the HTTPS reverse proxy connects from}
    secrets: [public_connection, audit_key]
    ports: ['127.0.0.1:5001:8080']
    networks: [database]
    depends_on:
      postgres: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  database:
    internal: true
volumes:
  database:
    external: true
    name: ${NEXUS_DB_VOLUME:?Set the explicitly provisioned production volume}
  backup:
    external: true
    name: ${NEXUS_BACKUP_VOLUME:?Set the separate local backup volume}
secrets:
  postgres_password:
    file: ${NEXUS_SECRET_DIR:?Set a private server directory}/postgres_password
  public_password:
    file: ${NEXUS_SECRET_DIR}/public_password
  migrator_password:
    file: ${NEXUS_SECRET_DIR}/migrator_password
  backup_cipher:
    file: ${NEXUS_SECRET_DIR}/backup_cipher
  public_connection:
    file: ${NEXUS_SECRET_DIR}/public_connection
  audit_key:
    file: ${NEXUS_SECRET_DIR}/audit_key
