# Every volume belongs to a unique verification project. No real DB credentials are accepted.
services:
  postgres:
    build: .
    image: nexus-postgres-verify:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nexus_verify
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      NEXUS_BACKUP_REPO_TYPE: posix
      NEXUS_DB_DISPOSABLE: '1'
    secrets: [postgres_password, admin_password, public_password, migrator_password, backup_cipher]
    volumes:
      - database:/var/lib/postgresql
      - backup:/backup
    ports: ['127.0.0.1::5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nexus_verify']
      interval: 2s
      timeout: 3s
      retries: 60
  recovery:
    image: nexus-postgres-verify:18.6
    profiles: [recovery]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nexus_verify
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      NEXUS_BACKUP_REPO_TYPE: posix
      NEXUS_DB_DISPOSABLE: '1'
    secrets: [postgres_password, admin_password, public_password, migrator_password, backup_cipher]
    volumes:
      - recovery:/var/lib/postgresql
      - backup:/backup
    command: ['postgres', '-c', 'archive_mode=off', '-c', 'timezone=UTC']
    ports: ['127.0.0.1::5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nexus_verify']
      interval: 2s
      timeout: 3s
      retries: 60
secrets:
  postgres_password:
    file: ${NEXUS_DB_VERIFY_DIR:?Set private verification directory}/postgres_password
  admin_password:
    file: ${NEXUS_DB_VERIFY_DIR}/admin_password
  public_password:
    file: ${NEXUS_DB_VERIFY_DIR}/public_password
  migrator_password:
    file: ${NEXUS_DB_VERIFY_DIR}/migrator_password
  backup_cipher:
    file: ${NEXUS_DB_VERIFY_DIR}/backup_cipher
volumes:
  database:
  backup:
  recovery:
