openapi: 3.0.3
info:
  title: Nexus Admin API
  version: 1.0.0
servers:
  - url: http://localhost:5000
paths:
  /admin/auth/login:
    post:
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Invalid username or password
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too many requests (retry after the Retry-After interval)
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
  /admin/tokens/revoke:
    post:
      summary: Revoke access token by jti
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRevocationRequest'
      responses:
        '200':
          description: Revocation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRevocationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/tokens/revoke-user:
    post:
      summary: Revoke access tokens by subject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTokenRevocationRequest'
      responses:
        '200':
          description: Revocation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenRevocationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/spots:
    get:
      summary: List spots
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Spot list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create spot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpotRequest'
      responses:
        '201':
          description: Created spot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Spot code already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /admin/spots/{id}:
    get:
      summary: Get spot
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Spot detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update spot
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpotRequest'
      responses:
        '200':
          description: Updated spot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Spot code already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      summary: Delete spot
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/spots/{id}/publish:
    patch:
      summary: Update spot publish state
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Updated spot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/spots/{id}/qr:
    get:
      summary: Get QR code PNG
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: QR code image
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/events:
    get:
      summary: List events
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Event list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '201':
          description: Created event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/events/{id}:
    get:
      summary: Get event
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update event
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '200':
          description: Updated event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete event
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/events/{id}/publish:
    patch:
      summary: Update event publish state
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Updated event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/events/{id}/timeslots:
    get:
      summary: List open campus timeslots of an event
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Timeslot list ordered by startsAt
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenCampusTimeslotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/qr-issues:
    get:
      summary: List QR issues (hidden beta)
      description: Ordered by issuedAt descending. `url` is always an empty string in this listing because the plain token is not stored.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: QR issue list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QrIssueResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/timeslots/{timeslotId}/qr-issues:
    post:
      summary: Issue a QR for a timeslot (hidden beta)
      description: Returns 200 (not 201). `url` contains the public URL with the plain token and is returned only by this endpoint. When `expiresAt` is omitted it defaults to 23:59:59 JST of the issuing day.
      security:
        - bearerAuth: []
      parameters:
        - name: timeslotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrIssueRequest'
      responses:
        '200':
          description: Issued QR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrIssueResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Timeslot is missing its event
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /admin/qr-issues/{id}/revoke:
    post:
      summary: Revoke a QR issue (hidden beta)
      description: Idempotent; an already revoked issue keeps its original revokedAt and revokeReason. `url` is an empty string and `timeslot` is null in this response.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeQrIssueRequest'
      responses:
        '200':
          description: Revoked QR issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrIssueResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/events/{eventId}/one-time-codes:
    post:
      summary: Generate one-time login codes
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimeCodeGenerateRequest'
      responses:
        '201':
          description: Generated one-time codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneTimeCodeGenerateResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/one-time-codes/redeem:
    post:
      summary: Redeem one-time login code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimeCodeRedeemRequest'
      responses:
        '200':
          description: Visitor access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneTimeCodeRedeemResponse'
        '400':
          description: 'Invalid request body (validation errors in `errors`), or invalid or expired code (detail is invalid_or_expired)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too many requests (retry after the Retry-After interval)
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
  /admin/oc-days:
    get:
      summary: List open campus days
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OcDay list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OcDayResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create open campus day
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcDayRequest'
      responses:
        '201':
          description: Created open campus day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcDayResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: OcDay date already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /admin/oc-days/{id}:
    delete:
      summary: Delete open campus day
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/logs/recent:
    get:
      summary: Get recent logs
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Values outside 1-100 are clamped to that range instead of being rejected.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: Visit log list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitLogResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/logs/verify:
    get:
      summary: Verify audit log chain
      security:
        - bearerAuth: []
      parameters:
        - name: chainId
          in: query
          schema:
            type: string
            nullable: true
        - name: start
          in: query
          schema:
            type: string
            format: date-time
            nullable: true
        - name: end
          in: query
          schema:
            type: string
            format: date-time
            nullable: true
      responses:
        '200':
          description: Audit log verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogVerificationResponse'
        '400':
          description: Neither chainId nor start/end was provided, end is earlier than start, or a query parameter is malformed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  responses:
    ValidationError:
      description: Request validation failed (malformed body or parameter, or data annotation violation)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    Unauthorized:
      description: Bearer token is missing, invalid, expired, or revoked
    Forbidden:
      description: Token does not have an admin role (Owner, Moderator, or Dev)
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProblemDetails:
      type: object
      description: RFC 7807 problem details as produced by ASP.NET Core (may include extra members such as traceId).
      additionalProperties: true
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
    TokenRevocationRequest:
      type: object
      required: [jti]
      properties:
        jti:
          type: string
        reason:
          type: string
          nullable: true
    TokenRevocationResponse:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: boolean
    UserTokenRevocationRequest:
      type: object
      required: [subject]
      properties:
        subject:
          type: string
        reason:
          type: string
          nullable: true
    UserTokenRevocationResponse:
      type: object
      required: [revokedCount]
      properties:
        revokedCount:
          type: integer
    PublishRequest:
      type: object
      required: [isPublished]
      properties:
        isPublished:
          type: boolean
    SpotRequest:
      type: object
      required: [code, name, description]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
          nullable: true
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        isPublished:
          type: boolean
          default: true
    SpotResponse:
      type: object
      required: [id, code, name, description, tags, lat, lng, isPublished, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
          nullable: true
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        isPublished:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    EventRequest:
      type: object
      required: [title, startsAt, endsAt]
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        locationText:
          type: string
          nullable: true
        isPublished:
          type: boolean
          default: true
    EventResponse:
      type: object
      required: [id, title, description, startsAt, endsAt, lat, lng, locationText, isPublished]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        locationText:
          type: string
          nullable: true
        isPublished:
          type: boolean
    OcDayRequest:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date
        name:
          type: string
          nullable: true
    OcDayResponse:
      type: object
      required: [id, date, name]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        name:
          type: string
          nullable: true
    OpenCampusTimeslotResponse:
      type: object
      required: [id, eventId, startsAt, endsAt]
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
    QrIssueRequest:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
          nullable: true
    RevokeQrIssueRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 200
          nullable: true
    TimeslotSummary:
      type: object
      required: [timeslotId, startsAt, endsAt]
      properties:
        timeslotId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
