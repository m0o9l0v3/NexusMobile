openapi: 3.0.3
info:
  title: Nexus Admin API
  version: 1.0.0
servers:
  - url: http://localhost:5000
paths:
  /admin/auth/login:
    post:
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '429':
          description: Too many requests (retry after the Retry-After interval)
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
  /admin/tokens/revoke:
    post:
      summary: Revoke access token by jti
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRevocationRequest'
      responses:
        '200':
          description: Revocation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRevocationResponse'
  /admin/tokens/revoke-user:
    post:
      summary: Revoke access tokens by subject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTokenRevocationRequest'
      responses:
        '200':
          description: Revocation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenRevocationResponse'
  /admin/spots:
    get:
      summary: List spots
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Spot list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpotResponse'
    post:
      summary: Create spot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpotRequest'
      responses:
        '201':
          description: Created spot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotResponse'
  /admin/spots/{id}:
    get:
      summary: Get spot
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Spot detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotResponse'
    put:
      summary: Update spot
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpotRequest'
      responses:
        '200':
          description: Updated spot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotResponse'
    delete:
      summary: Delete spot
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
  /admin/spots/{id}/publish:
    patch:
      summary: Update spot publish state
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Updated spot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotResponse'
  /admin/spots/{id}/qr:
    get:
      summary: Get QR code PNG
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: QR code image
          content:
            image/png:
              schema:
                type: string
                format: binary
  /admin/events:
    get:
      summary: List events
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Event list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponse'
    post:
      summary: Create event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '201':
          description: Created event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
  /admin/events/{id}:
    get:
      summary: Get event
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
    put:
      summary: Update event
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '200':
          description: Updated event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
    delete:
      summary: Delete event
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
  /admin/events/{id}/publish:
    patch:
      summary: Update event publish state
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Updated event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
  /admin/events/{eventId}/one-time-codes:
    post:
      summary: Generate one-time login codes
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimeCodeGenerateRequest'
      responses:
        '201':
          description: Generated one-time codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneTimeCodeGenerateResponse'
        '404':
          description: Event not found
  /admin/one-time-codes/redeem:
    post:
      summary: Redeem one-time login code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimeCodeRedeemRequest'
      responses:
        '200':
          description: Visitor access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneTimeCodeRedeemResponse'
        '400':
          description: Invalid or expired code
        '429':
          description: Too many requests (retry after the Retry-After interval)
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
  /admin/oc-days:
    get:
      summary: List open campus days
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OcDay list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OcDayResponse'
    post:
      summary: Create open campus day
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcDayRequest'
      responses:
        '201':
          description: Created open campus day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcDayResponse'
  /admin/oc-days/{id}:
    delete:
      summary: Delete open campus day
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
  /admin/logs/recent:
    get:
      summary: Get recent logs
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Visit log list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitLogResponse'
  /admin/logs/verify:
    get:
      summary: Verify audit log chain
      security:
        - bearerAuth: []
      parameters:
        - name: chainId
          in: query
          schema:
            type: string
            nullable: true
        - name: start
          in: query
          schema:
            type: string
            format: date-time
            nullable: true
        - name: end
          in: query
          schema:
            type: string
            format: date-time
            nullable: true
      responses:
        '200':
          description: Audit log verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogVerificationResponse'
  /admin/map-datasets/drafts:
    post:
      summary: Create a validated MapDataset draft
      description: Assigns the next dataset version, computes the SHA-256 checksum, and persists only payloads that pass draft validation. Publication checks are not performed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapDatasetDraftRequest'
      responses:
        '201':
          description: Created draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapDatasetDraftResponse'
        '400':
          description: Invalid request body
        '409':
          description: Dataset version allocation conflict
        '422':
          description: Payload failed draft validation and was not saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetValidationResponse'
  /admin/map-datasets/drafts/{id}:
    put:
      summary: Update a MapDataset draft
      description: Replaces the payload and checksum of an existing draft after draft validation. Published and archived datasets are immutable through this endpoint.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapDatasetDraftRequest'
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapDatasetDraftResponse'
        '400':
          description: Invalid request body
        '404':
          description: Dataset not found
        '409':
          description: Dataset is not a draft
        '422':
          description: Payload failed draft validation and was not saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetValidationResponse'
  /admin/map-datasets/drafts/validate:
    post:
      summary: Validate a candidate MapDataset draft
      description: Runs draft validation without saving or requesting publication checks. A completed validation is returned as 200 even when findings exist.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapDatasetDraftRequest'
      responses:
        '200':
          description: Structured draft validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetValidationResponse'
        '400':
          description: Invalid request body
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
    TokenRevocationRequest:
      type: object
      required: [jti]
      properties:
        jti:
          type: string
        reason:
          type: string
          nullable: true
    TokenRevocationResponse:
      type: object
      properties:
        revoked:
          type: boolean
    UserTokenRevocationRequest:
      type: object
      required: [subject]
      properties:
        subject:
          type: string
        reason:
          type: string
          nullable: true
    UserTokenRevocationResponse:
      type: object
      properties:
        revokedCount:
          type: integer
    PublishRequest:
      type: object
      required: [isPublished]
      properties:
        isPublished:
          type: boolean
    SpotRequest:
      type: object
      required: [code, name, description]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
          nullable: true
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        isPublished:
          type: boolean
    SpotResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
          nullable: true
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        isPublished:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    EventRequest:
      type: object
      required: [title, startsAt, endsAt]
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        locationText:
          type: string
          nullable: true
        isPublished:
          type: boolean
    EventResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        locationText:
          type: string
          nullable: true
        isPublished:
          type: boolean
    OcDayRequest:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date
        name:
          type: string
          nullable: true
    OcDayResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        name:
          type: string
          nullable: true
    VisitLogResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
        eventType:
          type: string
        spotCode:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    AuditLogVerificationResponse:
      type: object
      properties:
        isValid:
          type: boolean
        firstInvalidLogId:
          type: string
          format: uuid
          nullable: true
    MapDatasetDraftRequest:
      type: object
      required: [payload]
      properties:
        payload:
          type: string
          minLength: 1
          description: GeoJSON FeatureCollection encoded as a JSON string. The decoded string is stored byte-for-byte and checksummed as UTF-8.
    MapDatasetDraftResponse:
      type: object
      required: [id, version, status, payload, checksum]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum: [draft]
        payload:
          type: string
        checksum:
          type: string
          pattern: '^[0-9a-f]{64}$'
        publishedAt:
          type: string
          format: date-time
          nullable: true
    DatasetValidationResponse:
      type: object
      required: [isValid, canPublish, errors]
      properties:
        isValid:
          type: boolean
        canPublish:
          type: boolean
          description: Always false for these draft endpoints because publication checks are not requested.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationFinding'
    ValidationFinding:
      type: object
      required: [code, path, message]
      properties:
        code:
          type: string
        path:
          type: string
          description: JSON Pointer identifying the finding location.
        message:
          type: string
        canonicalId:
          type: string
          nullable: true
    OneTimeCodeGenerateRequest:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 1000
    OneTimeCodePayloadResponse:
      type: object
      properties:
        code:
          type: string
        redeemUrl:
          type: string
    OneTimeCodeGenerateResponse:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        codes:
          type: array
          items:
            $ref: '#/components/schemas/OneTimeCodePayloadResponse'
    OneTimeCodeRedeemRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    OneTimeCodeRedeemResponse:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        visitorId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        accessToken:
          type: string
